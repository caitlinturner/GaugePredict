[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GaugePredict"
version = "0.1.0"
description = "Basin-scale CNN–LSTM river forecasting utilities"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Caitlin Turner" }]

dependencies = [
  "numpy",
  "pandas",
  "torch",
  "scikit-learn",
  "shap",
  "dataretrieval",
  "matplotlib",
  "cmocean",
  "geopandas",
  "contextily",
  "psutil",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
